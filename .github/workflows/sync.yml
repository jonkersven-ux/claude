name: Prijzen-sync

# Checkt API-Football op nieuwe prijzen. Bij een nieuwe prijs: data aanpassen, controleren, committen.
# De commit triggert de hosting (Netlify), die de site en de preview-afbeelding opnieuw bouwt.
on:
  schedule:
    - cron: '23 22 * * *'   # elke avond na de wedstrijden (UTC)
    - cron: '47 5 * * *'    # elke ochtend, vangt late finales en nachtelijke uitslagen
    - cron: '11 4 * * 1'    # maandag: volledige controle van alle competities
  workflow_dispatch:
    inputs:
      all:
        description: 'Alle competities checken (niet alleen die in hun beslis-maanden)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency: prijzen-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Sync met API-Football
        id: sync
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          ALL=""
          if [ "${{ github.event.schedule }}" = "11 4 * * 1" ] || [ "${{ inputs.all }}" = "true" ]; then ALL="--all"; fi
          set +e
          node scripts/sync.mjs $ALL | tee sync.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit "$code"; fi

      - name: Data en logica controleren
        run: |
          node scripts/validate.mjs
          npm test

      - name: Committen en pushen
        run: |
          if git diff --quiet -- data/; then echo "Geen wijzigingen."; exit 0; fi
          git config user.name "notrophy-bot"
          git config user.email "notrophy-bot@users.noreply.github.com"
          git add data/
          MSG=$(grep '🏆' sync.log | sed 's/^ *//' | head -5)
          git commit -m "Nieuwe prijs via sync" -m "${MSG:-API-koppelingen bijgewerkt}"
          git push

      - name: Issue bij problemen
        if: steps.sync.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(printf 'De prijzen-sync van %s vond iets dat een mens moet bekijken:\n\n```\n%s\n```\n' "$(date -u +%F)" "$(cat sync.log)")
          gh issue create --title "Prijzen-sync: controle nodig ($(date -u +%F))" --body "$BODY"
